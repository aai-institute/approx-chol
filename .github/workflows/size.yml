name: Size

# Its own workflow, so retitling a PR reruns this alone: the title's type decides whether it gates.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: Size (a refactor must not grow src code or tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scripts/size.sh against the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kind=${TITLE%%[(:!]*}
          status=0
          scripts/size.sh "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD "$kind" > size.txt 2>&1 || status=$?
          { echo "**$kind**"; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat size.txt
          exit "$status"
