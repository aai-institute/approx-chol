name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # Both free-threaded jobs build this one interpreter; `publish.yml` has its own copy.
  FREETHREADED_PYTHON: "3.14t"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check + Coverage (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ci
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: pixi run -e ci cargo fmt --all -- --check
      - name: cargo clippy
        run: pixi run -e ci cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # approx-chol's 3 optional features (serde, sprs, faer) are a full powerset of 8;
      # small enough to enumerate directly rather than add cargo-hack, which isn't on
      # conda-forge (#55). default = [] makes "default" and "no-default-features" the
      # same build, so the empty-set iteration below replaces both rather than paying
      # for that combination twice.
      - name: cargo clippy (approx-chol feature powerset)
        run: |
          for features in "" serde sprs faer serde,sprs serde,faer sprs,faer serde,sprs,faer; do
            echo "::group::features=[$features]"
            pixi run -e ci cargo clippy -p approx-chol --all-targets --no-default-features --features "$features" --locked -- -D warnings
            echo "::endgroup::"
          done
      # cargo test only ever runs under --all-features (in coverage below); a feature
      # gated away by default there would silently vanish rather than fail.
      - name: cargo test (default features)
        run: pixi run -e ci cargo test --workspace --locked
      - name: coverage (cargo test + pytest, instrumented)
        run: pixi run -e ci coverage

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace, all features, at the declared MSRV)
        run: cargo check --workspace --all-features --locked

  # Baseline is the last published release, so a breaking change stays red until the
  # version bump that reflects it lands with it.
  semver:
    name: Public API (semver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: gates
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo semver-checks
        run: pixi run -e gates semver

  # deny.toml's [graph] targets keeps future target-only deps out of the graph.
  deny:
    name: Dependency policy (licenses, duplicates, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: gates
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny
        run: pixi run -e gates deny

  # Runs on PRs: this crate's behaviour is precision- and platform-dependent
  # (`near_zero` differs by four orders between f32 and f64), so a Linux-only verdict
  # would let that class land on main unattributed.
  platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: platform
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: pixi run -e platform cargo test --workspace --all-features --locked
      - name: pytest
        run: pixi run -e platform test

  # Packaging, not correctness: postponing this to merge (import-matrix and
  # floor need it too, and a skipped `needs` skips them along with it) keeps
  # every PR to Rust-only checks plus platform's cross-OS test matrix.
  wheel:
    name: abi3 wheel (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/abi3-wheel

  # Free-threaded wheels are version-specific, so the interpreter that builds
  # one is also the only interpreter that can run it. The action therefore
  # tests in place and this job feeds no import matrix.
  wheel-freethreaded:
    name: free-threaded wheel (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/freethreaded-wheel
        with:
          python-version: ${{ env.FREETHREADED_PYTHON }}

  import-matrix:
    name: Import + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ runner.os }}
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install the single abi3 wheel and run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
          pytest tests/ -v

  # `lowest-direct` is what makes `numpy>=1.24`/`scipy>=1.12` a tested claim
  # rather than a guess; py3.9 at the highest resolution is import-matrix's job.
  floor:
    name: Floor (py3.9, lowest-direct deps)
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wheel-Linux
          path: dist
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: floor
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: resolve and run the suite against the floor
        run: |
          pixi run -e floor uv venv --python 3.9 .venv
          pixi run -e floor uv pip install --python .venv \
            --resolution lowest-direct dist/*.whl
          pixi run -e floor uv pip install --python .venv pytest
          .venv/bin/python -c 'import numpy, scipy, sys; print(
            f"python {sys.version.split()[0]}  numpy {numpy.__version__}  scipy {scipy.__version__}")'
          .venv/bin/python -m pytest tests/ -v
