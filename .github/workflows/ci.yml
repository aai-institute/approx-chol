name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # Both free-threaded jobs build this one interpreter; `publish.yml` has its own copy.
  FREETHREADED_PYTHON: "3.14t"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check + Coverage (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ci
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: pixi run -e ci cargo fmt --all -- --check
      - name: cargo clippy
        run: pixi run -e ci cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # All-features is clippied above; hand-enumerated since cargo-hack isn't on conda-forge (#55).
      - name: cargo clippy (approx-chol feature subsets)
        run: |
          for features in "" serde sprs faer serde,sprs serde,faer sprs,faer; do
            echo "::group::features=[$features]"
            pixi run -e ci cargo clippy -p approx-chol --all-targets --no-default-features --features "$features" --locked -- -D warnings
            echo "::endgroup::"
          done
      # Coverage tests only --all-features, which hides breakage with features off.
      - name: cargo test (default features)
        run: pixi run -e ci cargo test --workspace --locked
      - name: coverage (cargo test + pytest, instrumented)
        run: pixi run -e ci coverage

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace, all features, at the declared MSRV)
        run: cargo check --workspace --all-features --locked

  # Baselined on the last release, so a breaking change stays red until its version bump lands.
  semver:
    name: Public API (semver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: gates
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo semver-checks
        run: pixi run -e gates semver

  # deny.toml's [graph] targets keeps future target-only deps out of the graph.
  deny:
    name: Dependency policy (licenses, duplicates, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: gates
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny
        run: pixi run -e gates deny

  # On PRs: behaviour is precision- and platform-dependent, so a Linux-only verdict lets that onto main.
  platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: platform
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: pixi run -e platform cargo test --workspace --all-features --locked
      - name: pytest
        run: pixi run -e platform test

  # Packaging, not correctness, so deferred to merge; import-matrix and floor skip with it via `needs`.
  wheel:
    name: abi3 wheel (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/abi3-wheel

  # A free-threaded wheel runs only on the interpreter that built it, so the action tests in place.
  wheel-freethreaded:
    name: free-threaded wheel (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/freethreaded-wheel
        with:
          python-version: ${{ env.FREETHREADED_PYTHON }}

  import-matrix:
    name: Import + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ runner.os }}
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install the single abi3 wheel and run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
          pytest tests/ -v

  # `lowest-direct` makes the numpy/scipy floors a tested claim rather than a guess.
  floor:
    name: Floor (py3.9, lowest-direct deps)
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wheel-Linux
          path: dist
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: floor
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: resolve and run the suite against the floor
        run: |
          pixi run -e floor uv venv --python 3.9 .venv
          pixi run -e floor uv pip install --python .venv \
            --resolution lowest-direct dist/*.whl
          pixi run -e floor uv pip install --python .venv pytest
          .venv/bin/python -c 'import numpy, scipy, sys; print(
            f"python {sys.version.split()[0]}  numpy {numpy.__version__}  scipy {scipy.__version__}")'
          .venv/bin/python -m pytest tests/ -v
