name: Perf Alert

# Times the headline banded factorization on every merge to main and compares
# the best of N runs against a committed, FIXED reference. A regression is
# reported, never fails the build: this runs post-merge, so it cannot block a
# merge, and a wall-clock gate on shared runners produces flaky failures and
# gets disabled. A bench that emits no number does fail — that is breakage, not
# a perf signal. (#60)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wallclock:
    name: Wall-clock banded factorization (alert only)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      # Build-only environment: this job runs one cargo command and needs
      # neither the test stack nor the coverage tooling that `ci` carries.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: wheel
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Time the headline factorization (release, best-of-N)
        run: pixi run -e wheel bench-wallclock | tee bench.out

      - name: Compare against committed reference
        run: pixi run -e wheel python scripts/check-wallclock-reference.py --bench-output bench.out --commit "${{ github.sha }}"
