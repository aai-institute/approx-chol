name: Perf Reference

# The only thing that writes the reference: a number measured on a maintainer's
# laptop is meaningless against a runner. (#60)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REFERENCE_FILE: benches/wallclock_reference.json

jobs:
  refresh:
    name: Refresh wall-clock reference
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::dispatch this workflow on main"
          exit 1

      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: wheel
          cache: true
          cache-write: true
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Time the headline factorization (release, best-of-N)
        run: pixi run -e wheel bench-wallclock | tee bench.out

      - name: Update reference
        run: pixi run -e wheel python scripts/check-wallclock-reference.py --bench-output bench.out --update

      # A branch, not a push to main: the bench takes minutes, long enough for a
      # merge to land and make a direct push a non-fast-forward. The summary asks
      # a human to open the pull request, because a bot-opened one does not run
      # the required checks.
      - name: Push refresh branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if git diff --quiet -- "$REFERENCE_FILE"; then
            printf 'Reference unchanged, so no branch was pushed. The comparison is in the step above.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          best_ns="$(pixi run -e wheel python -c 'import json,sys; print(json.load(open(sys.argv[1]))["best_ns"])' "$REFERENCE_FILE")"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          branch="perf/reference-$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$REFERENCE_FILE"
          git commit -m "chore(perf): refresh wall-clock reference to ${best_ns}ns (#60)" -m "Measured on ${SOURCE_SHA}."
          git push origin "$branch"
          printf 'Refreshed the reference to %s ns, measured on `%s`.\n\n[Open the pull request](%s/compare/main...%s?expand=1) — opening it yourself runs the required checks, which a bot-opened pull request cannot.\n' \
            "$best_ns" "$SOURCE_SHA" "$REPO_URL" "$branch" | tee -a "$GITHUB_STEP_SUMMARY"
