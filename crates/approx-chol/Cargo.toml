[package]
name = "approx-chol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Approximate Cholesky factorization for symmetric generalized diagonally dominant matrices"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["laplacian", "sparse", "cholesky", "preconditioner", "sddm"]
categories.workspace = true
# A nested workspace nothing in the published crate reads.
exclude = ["fuzz"]

# The workspace's, but unsafe code denied, not forbidden: factor/spread.rs alone allows it, to write blocks of one solve at once.
[lints.rust]
unsafe_code = "deny"

[dependencies]
dyn-stack = { version = "0.13.2", default-features = false, features = ["alloc"] }
num-traits = "0.2.18"
rand = "0.10.0"
rayon = "1.6"
serde = { version = "1", features = ["derive"], optional = true }
sprs = { version = "0.11", optional = true, default-features = false }
faer = { version = "0.24", optional = true, default-features = false }

[features]
serde = ["dep:serde"]
sprs = ["dep:sprs"]
faer = ["dep:faer"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
faer = { version = "0.24", default-features = false, features = ["rayon"] }
postcard = { version = "1", features = ["use-std"] }
proptest = "1.6"
rstest = { version = "0.26.1", default-features = false }
serde_json = "1"

[[bench]]
name = "exact_max_dim"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "solve"
harness = false

[[bench]]
name = "wallclock_banded"
harness = false

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "reduce"
harness = false
