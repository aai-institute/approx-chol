[package]
name = "approx-chol-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for approx-chol (approximate Cholesky factorization)"
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "_approx_chol"
crate-type = ["cdylib"]
bench = false
test = false

[dependencies]
approx-chol = { path = "../approx-chol" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
