[package]
name = "approx-chol-next-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[dependencies.approx-chol-next]
path = ".."

# The build script writes the seed corpus.
[build-dependencies]
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies.approx-chol-next]
path = ".."

[[bin]]
name = "factor_from_bytes"
path = "fuzz_targets/factor_from_bytes.rs"
test = false
doc = false
bench = false

# Its own workspace: cargo-fuzz needs nightly, and this keeps that requirement from
# reaching the crates the released build is compiled from.
[workspace]
