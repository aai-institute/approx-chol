[package]
name = "approx-chol-next"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rewrite prototype of approx-chol, cut by the algorithm's stages"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
num-traits = "0.2"
rand = "0.10.0"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"], optional = true }
sprs = { version = "0.11", optional = true, default-features = false }
faer = { version = "0.24", optional = true, default-features = false }

[features]
serde = ["dep:serde"]
sprs = ["dep:sprs"]
faer = ["dep:faer"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
faer = { version = "0.24", default-features = false }
postcard = { version = "1", features = ["use-std"] }
proptest = "1.6"
rstest = { version = "0.26.1", default-features = false }

[[bench]]
name = "backend"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "solve"
harness = false

[[bench]]
name = "wallclock_banded"
harness = false
