[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause"]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "equator@0.2.2", reason = "pulled by faer's nano-gemm 0.2.2; faer 0.24 also depends on equator 0.6.0 directly" },
    { crate = "equator-macro@0.2.1", reason = "proc-macro half of the equator 0.2.2 pin above" },
]
skip-tree = [
    { crate = "proptest@1.10.0", reason = "dev-only; proptest and its dev-only companion tempfile both pull a rand 0.9 lineage (rand, rand_core, getrandom, rand_chacha, rand_xorshift) while the library depends on rand 0.10" },
    { crate = "spindle@0.2.6", reason = "faer's rayon feature, which the faer feature enables; pulls equator 0.4.2 beside faer's 0.6.0" },
    { crate = "sysctl@0.6.0", reason = "faer's rayon feature via gemm-common, which the faer feature enables; pulls thiserror 1 beside postcard's (dev-only) thiserror 2" },
]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no safe upgrade; pulled transitively via faer's gemm backend, not a direct choice" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
