[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[dependencies]
# Dev interpreter only; <3.14 keeps the solver off free-threaded builds, where `maturin build` drops abi3.
python = ">=3.11,<3.14"

[feature.build.dependencies]
rust = ">=1.85"
maturin = ">=1.7"
uv = ">=0.4"

# Split from the tools below so a test-only job doesn't install them.
[feature.test.dependencies]
pytest = ">=7.0"
numpy = ">=1.24"
scipy = ">=1.12"

[feature.coverage.dependencies]
cargo-llvm-cov = ">=0.8.4,<0.9"

[feature.gates.dependencies]
cargo-deny = ">=0.20.2,<0.21"
cargo-semver-checks = ">=0.49,<0.50"

# Not in `ci`: the editable install compiles the extension at `pixi install`, before sccache is set up.
[feature.dev.dependencies]
samply = ">=0.13"
cargo-mutants = ">=27.1,<28"
pixi-pycharm = ">=0.0.10,<0.0.11"

[feature.dev.pypi-dependencies]
approx-chol = { path = ".", editable = true }

# Isolated so `pixi run -e audit abi3audit <wheel>` installs only the auditor.
[feature.audit.dependencies]
abi3audit = ">=0.0.26"

# Isolated: uv fetches its own interpreter, so the floor job needs neither Rust nor `ci`'s python.
[feature.floor.dependencies]
uv = ">=0.4"

# One environment per job shape, so nothing installs a tool it will not run.
[environments]
default = { features = ["build", "test", "coverage", "gates", "dev"], solve-group = "default" }
ci = { features = ["build", "test", "coverage"], solve-group = "default" }
wheel = { features = ["build"], solve-group = "default" }
platform = { features = ["build", "test"], solve-group = "default" }
gates = { features = ["build", "gates"], solve-group = "default" }
audit = { features = ["audit"] }
floor = { features = ["floor"] }

[tasks]
test = "maturin develop --uv --locked && pytest tests/ -v"
develop = "maturin develop --uv --release --locked"
bench-wallclock = "cargo bench -p approx-chol --bench wallclock_banded --locked"
coverage = "./scripts/coverage-with-python.sh"
deny = "cargo deny --locked check"
# approx-chol-py's real surface is the Python ABI, which cargo-semver-checks cannot analyze.
semver = "cargo semver-checks --package approx-chol --all-features"
# Mutants in compiled-out code survive trivially, so serde is enabled and sprs/faer adapters excluded.
mutants = "cargo mutants -C --locked --features serde"
