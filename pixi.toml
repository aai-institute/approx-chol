[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11"

[feature.build.dependencies]
rust = ">=1.75"
maturin = ">=1.7"
uv = ">=0.4"

# Everything CI needs: suite, coverage, and the gate tools.
[feature.test.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
cargo-llvm-cov = ">=0.8.4,<0.9"
cargo-deny = ">=0.20.2,<0.21"
cargo-semver-checks = ">=0.49,<0.50"

# The editable install belongs here, not in `ci`: it compiles the extension
# during `pixi install`, which CI must not pay before sccache is configured.
[feature.dev.dependencies]
samply = ">=0.13"
cargo-mutants = ">=27.1,<28"
pixi-pycharm = ">=0.0.10,<0.0.11"

[feature.dev.pypi-dependencies]
approx-chol = { path = ".", editable = true }

# Isolated so `pixi run -e audit abi3audit <wheel>` installs only the auditor.
[feature.audit.dependencies]
abi3audit = ">=0.0.26"

[environments]
default = { features = ["build", "test", "dev"], solve-group = "default" }
ci = { features = ["build", "test"], solve-group = "default" }
audit = { features = ["audit"] }

[tasks]
test = "maturin develop --uv --locked && pytest tests/ -v"
develop = "maturin develop --uv --release --locked"
bench-smoke = "cargo bench -p approx-chol --bench smoke -- --sample-size 10 --warm-up-time 0.05 --measurement-time 0.1"
coverage = "./scripts/coverage-with-python.sh"
coverage-rust = "cargo llvm-cov --workspace --all-features --locked --summary-only"
deny = "cargo deny --locked check"
semver = "cargo semver-checks --package approx-chol"
mutants = "cargo mutants -C --locked"

[feature.audit.tasks]
abi3audit = "abi3audit --strict"
