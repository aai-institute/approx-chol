[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[dependencies]
# Dev interpreter only, not the support range: shipped support is 3.9+ (abi3)
# and is proven by the import matrix. <3.14 keeps the solver off the
# free-threaded build, which has no stable ABI (PEP 803 lands abi3t in 3.15),
# so maturin would drop abi3 and emit a version-specific wheel from a plain
# `maturin build`. Free-threaded wheels are built deliberately, by the
# wheel-freethreaded job pinning an explicit 3.13t/3.14t interpreter.
python = ">=3.11,<3.14"

[feature.build.dependencies]
rust = ">=1.85"
maturin = ">=1.7"
uv = ">=0.4"

# The suite itself. Split from the tools below so a job that only runs tests does
# not install the ones that measure or gate them.
[feature.test.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
numpy = ">=1.24"
scipy = ">=1.12"

[feature.coverage.dependencies]
cargo-llvm-cov = ">=0.8.4,<0.9"

# No job runs these yet; #52 and #54 add the gates.
[feature.gates.dependencies]
cargo-deny = ">=0.20.2,<0.21"
cargo-semver-checks = ">=0.49,<0.50"

# The editable install belongs here, not in `ci`: it compiles the extension
# during `pixi install`, which CI must not pay before sccache is configured.
[feature.dev.dependencies]
samply = ">=0.13"
cargo-mutants = ">=27.1,<28"
pixi-pycharm = ">=0.0.10,<0.0.11"

[feature.dev.pypi-dependencies]
approx-chol = { path = ".", editable = true }

# Isolated so `pixi run -e audit abi3audit <wheel>` installs only the auditor.
[feature.audit.dependencies]
abi3audit = ">=0.0.26"

# Isolated for the same reason as `audit`: the floor job resolves and runs
# against an interpreter uv fetches itself, so it needs neither Rust nor the
# pinned python of the `ci` environment.
[feature.floor.dependencies]
uv = ">=0.4"

# One environment per job shape, so nothing installs a tool it will not run.
[environments]
default = { features = ["build", "test", "coverage", "gates", "dev"], solve-group = "default" }
ci = { features = ["build", "test", "coverage"], solve-group = "default" }
platform = { features = ["build", "test"], solve-group = "default" }
gates = { features = ["build", "gates"], solve-group = "default" }
audit = { features = ["audit"] }
floor = { features = ["floor"] }

[tasks]
test = "maturin develop --uv --locked && pytest tests/ -v"
develop = "maturin develop --uv --release --locked"
bench-smoke = "cargo bench -p approx-chol --bench smoke -- --sample-size 10 --warm-up-time 0.05 --measurement-time 0.1"
coverage = "./scripts/coverage-with-python.sh"
coverage-rust = "cargo llvm-cov --workspace --all-features --locked --summary-only"
deny = "cargo deny --locked check"
semver = "cargo semver-checks --package approx-chol"
mutants = "cargo mutants -C --locked"

[feature.audit.tasks]
abi3audit = "abi3audit --strict"
